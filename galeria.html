<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galería de personajes</title>
  <link rel="icon" href="Logo.png" type="image/png" />
  <style>
    :root {
      --bg: #000000;
      --panel: #111111;
      --card: #f5c400;
      --text: #f5c400;
      --muted: #f2d968;
      --border: #f5c400;
      --shadow: rgba(245, 196, 0, 0.2);
      --contact-bg: #2d120d;
      --contact-accent: #ff7a59;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 18px 60px;
    }

    .topbar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      color: var(--text);
      text-align: center;
      font-size: clamp(2rem, 3vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      margin-top: 28px;
    }

    .character-card {
      display: block;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: #000000;
      box-shadow: 0 8px 18px var(--shadow);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .character-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(245, 196, 0, 0.28);
    }

    .character-card img {
      display: block;
      width: 100%;
      height: 260px;
      object-fit: cover;
      background: #111111;
      border-bottom: 2px solid var(--border);
    }

    .card-copy {
      padding: 14px 16px 18px;
    }

    .card-copy h2 {
      margin: 0 0 6px;
      font-size: 1.05rem;
      color: #000000;
      font-weight: 700;
    }

    .card-copy p {
      margin: 0;
      color: #1a1a1a;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .contacto {
      margin-top: 36px;
      padding: 24px 20px 12px;
      background: rgba(45, 18, 13, 0.9);
      border: 2px solid #f5c400;
      border-radius: 12px;
      box-shadow: 0 0 0 2px rgba(245, 196, 0, 0.15);
    }

    .contacto h3 {
      margin: 0 0 16px;
      color: #f5c400;
      font-size: 1.2rem;
      text-transform: none;
    }

    .mensaje {
      display: inline-block;
      margin-bottom: 18px;
      padding: 10px 12px;
      background: rgba(245, 196, 0, 0.16);
      border-radius: 8px;
      color: #f5c400;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .gmail-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: transparent;
      border: 2px solid #f5c400;
      border-radius: 10px;
      color: #f5c400;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.18s ease;
    }

    .gmail-btn:hover {
      background: rgba(245, 196, 0, 0.12);
      transform: translateY(-1px);
    }

    .gmail-btn img {
      width: 22px;
      height: 22px;
      display: block;
    }

    @media (max-width: 600px) {
      .page { padding-top: 20px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .mensaje { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>Personajes favoritos de Lucas Amarfil</h1>
    </div>

    <div id="gallery" class="gallery-grid" aria-live="polite"></div>

    <section class="contacto" aria-label="Contacto">
      <div class="mensaje">
        Gracias por visitar mi galería 😊. Si te gustan mis dibujos, puedes enviarme un mensaje por Gmail. ¡Me alegra que disfrutes de mi arte!
      </div>
      <br />
      <a href="mailto:amarfill30@gmail.com" class="gmail-btn">
        <img src="gmail.png" alt="Gmail" />
        Enviar por Gmail
      </a>
    </section>
  </div>

  <script src="characters.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
